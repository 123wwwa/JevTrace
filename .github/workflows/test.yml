# Builds JevTrace and runs the test suite on every OS it is used on. The tests are offline: they use the
# include-all judge or a local stand-in provider, so no provider key is needed.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['video/**', 'docs/**', 'assets/**', '**.md', '.github/workflows/video-page.yml']
  pull_request:
    paths-ignore: ['video/**', 'docs/**', 'assets/**', '**.md', '.github/workflows/video-page.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
