<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JevTrace UI host</title>
  <style>
    :root { font: 14px/1.5 system-ui, sans-serif; }
    body { margin: 0; background: #f4f4f1; color: #1d1f1b; }
    body.dark { background: #0d0d0d; color: #e8e9e4; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid rgba(128,128,128,.25); font-size: 12px; }
    .toolbar strong { font-size: 13px; }
    .toolbar .meta { opacity: .6; }
    .chat { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .message { font-size: 13px; opacity: .75; margin-bottom: 10px; }
    iframe { display: block; width: 100%; height: 160px; border: 0; background: transparent; }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>MCP Apps test host</strong>
    <label>State <select id="state"></select></label>
    <button id="theme" type="button">Dark theme</button>
    <span class="meta" id="meta"></span>
  </div>
  <div class="chat">
    <div class="message" id="message"></div>
    <div id="view"></div>
  </div>
  <script type="module" src="./host.ts"></script>
</body>
</html>
